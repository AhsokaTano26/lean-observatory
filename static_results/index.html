<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-dns-prefetch-control" content="off">
  <meta http-equiv="Content-Security-Policy" content="connect-src 'none'; object-src 'none'; form-action 'none'">
  <title>Lean Observatory · 验证结果存档</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./app.css">
  <script src="./data.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳到内容</a>
  <header class="site-header">
    <div class="masthead">
      <p class="wordmark">Lean Observatory<span>.</span></p>
      <button id="theme" class="theme" type="button" aria-label="切换深色主题">◐</button>
    </div>
  </header>
  <main id="main">
    <div class="intro">
      <h1>验证结果存档</h1>
      <p id="snapshot" class="meta"></p>
    </div>
    <p id="loading" role="status">正在读取本地结果存档。若页面停留在此处，请确认浏览器已启用 JavaScript，并将 data.js 与 index.html 放在同一目录。</p>
    <div id="archive" hidden>
      <div id="projects" class="projects"></div>
      <section class="cost" aria-labelledby="cost-title">
        <div>
          <h2 id="cost-title">共享服务器费用估算</h2>
          <p id="cost-note" class="meta"></p>
        </div>
        <strong id="cost-amount"></strong>
      </section>
      <section id="detail" aria-label="项目详情">
        <div class="detail-header">
          <div>
            <h2 id="project-name" tabindex="-1"></h2>
            <p id="project-status" class="project-status"></p>
          </div>
          <nav id="project-switch" class="switch" aria-label="切换项目"></nav>
        </div>
        <div id="metrics" class="metrics"></div>
        <p id="review" class="note"></p>
        <div id="external" class="note external" hidden></div>
        <section class="panel" aria-labelledby="stage-title">
          <div class="panel-title"><h3 id="stage-title">验证阶段</h3></div>
          <ol id="stages" class="stages"></ol>
        </section>
        <div class="evidence-grid">
          <section class="panel" aria-labelledby="audit-title">
            <div class="panel-title"><h3 id="audit-title">定理审计</h3><span id="audit-count" class="meta"></span></div>
            <div id="audits"></div>
          </section>
          <section class="panel" aria-labelledby="source-title">
            <div class="panel-title"><h3 id="source-title">源码与环境</h3></div>
            <dl id="source" class="source"></dl>
          </section>
        </div>
        <section class="panel" aria-labelledby="logs-title">
          <div class="panel-title"><h3 id="logs-title">日志预览</h3><span class="meta">最近 300 条</span></div>
          <div class="log-filters">
            <label for="log-search">搜索日志
              <input id="log-search" type="search" placeholder="输入关键词" autocomplete="off">
            </label>
            <label for="log-stage">日志阶段
              <select id="log-stage"><option value="">全部阶段</option></select>
            </label>
          </div>
          <p id="log-count" class="log-count meta" aria-live="polite"></p>
          <div id="log-rows" class="logs" role="region" aria-label="日志条目" tabindex="0"></div>
        </section>
        <section class="panel" aria-labelledby="downloads-title">
          <div class="panel-title"><h3 id="downloads-title">证据下载</h3></div>
          <ul id="downloads" class="downloads"></ul>
        </section>
      </section>
    </div>
  </main>
</body>
</html>
