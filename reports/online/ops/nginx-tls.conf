worker_processes 1;
events { worker_connections 1024; }
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=mutations:10m rate=3r/s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream observatory { zone observatory 64k; server api:8787 resolve; keepalive 16; }
  server {
    listen 80;
    server_name lean.tano.asia lean.lanunion.org.cn;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
  }
  server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/lean.tano.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lean.tano.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name lean.tano.asia lean.lanunion.org.cn;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/events {
      proxy_pass http://observatory;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no;
    }
    location ~ ^/api/(runs|control)$ {
      limit_req zone=mutations burst=10 nodelay;
      proxy_pass http://observatory;
      proxy_set_header Host $http_host;
    }
    location / {
      proxy_pass http://observatory;
      proxy_set_header Host $http_host;
      proxy_read_timeout 120s;
    }
  }
}
