services:
  rh:
    image: python:3.13-slim-bookworm
    command: [python3, -m, http.server, "8787", --directory, /fixture]
    volumes: ["${PROXY_FIXTURE_ROOT}/rh:/fixture:ro"]
    networks:
      rhnet:
        aliases: [api, lean-observatory-api-1]
    cpus: 0.1
    mem_limit: 64m
  ns:
    image: lean-shared-https-test-ns
    build:
      context: ../../..
      dockerfile: ns_queue/Web.Dockerfile
    command: [python3, -m, ns_queue.web, --root, /data, --host, 0.0.0.0, --port, "8792"]
    volumes: ["${PROXY_FIXTURE_ROOT}/data:/data:ro"]
    networks:
      nsnet:
        aliases: [api, lean-observatory-ns-api-1]
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cpus: 0.1
    mem_limit: 96m
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:9444:443", "127.0.0.1:9080:80"]
    volumes:
      - "${PROXY_FIXTURE_ROOT}/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "${PROXY_FIXTURE_ROOT}/certs:/etc/letsencrypt:ro"
    networks: [rhnet, nsnet]
    depends_on: [rh, ns]
    cpus: 0.2
    mem_limit: 64m
    pids_limit: 32
networks:
  rhnet: {}
  nsnet: {}
