worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 128; }
http {
  access_log /dev/stdout;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream ns_api { zone ns_api 64k; server api:8792 resolve; keepalive 4; }
  server {
    listen 9443 ssl;
    server_name lean.tano.asia lean.lanunion.org.cn;
    ssl_certificate /etc/letsencrypt/live/lean.tano.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lean.tano.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location /api/events {
      proxy_pass http://ns_api;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no;
    }
    location / {
      proxy_pass http://ns_api;
      proxy_set_header Host $http_host;
      proxy_read_timeout 120s;
    }
  }
}
